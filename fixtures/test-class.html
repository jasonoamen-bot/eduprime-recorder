<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Fake class</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0e; color: #fff; font-family: system-ui, sans-serif; overflow: hidden; }
  #clock { position: absolute; left: 40px; top: 30px; font-size: 64px; font-variant-numeric: tabular-nums; }
  #label { position: absolute; left: 40px; top: 120px; font-size: 24px; color: #8a8a93; }
  #box { position: absolute; top: 300px; width: 120px; height: 120px; background: #4f8cff; border-radius: 16px; }
  #text { position: absolute; left: 40px; bottom: 40px; font-size: 22px; line-height: 1.4; max-width: 900px; }
</style>
</head>
<body>
<div id="clock">00:00.0</div>
<div id="label">Fake class page: stands in for /live/egress-template</div>
<div id="box"></div>
<div id="text">Der schnelle braune Fuchs springt über den faulen Hund. Ich lerne Deutsch, weil ich in Deutschland arbeiten möchte.</div>
<script>
// Same contract as the real page: window.__recorder.state.
window.__recorder = { state: "connecting" };
const params = new URLSearchParams(location.search);
const lengthSeconds = Number(params.get("len") || 30);

const t0 = performance.now();
function frame() {
  const t = (performance.now() - t0) / 1000;
  const m = String(Math.floor(t / 60)).padStart(2, "0");
  const s = (t % 60).toFixed(1).padStart(4, "0");
  document.getElementById("clock").textContent = `${m}:${s}`;
  document.getElementById("box").style.left = (40 + ((t * 300) % 1100)) + "px";
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// A steady tone so the audio path can be measured. Autoplay is allowed by the recorder's browser flags.
try {
  const ctx = new AudioContext();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.frequency.value = 440;
  gain.gain.value = 0.2;
  osc.connect(gain).connect(ctx.destination);
  osc.start();
} catch (e) { console.error("audio failed", e); }

setTimeout(() => { window.__recorder.state = "connected"; }, 1500);
setTimeout(() => { window.__recorder.state = "ended"; }, lengthSeconds * 1000);
</script>
</body>
</html>
